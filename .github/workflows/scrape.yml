name: Update Economic Indicators

on:
  schedule:
    - cron: "0 */6 * * *"  # Cada 6 horas
  workflow_dispatch:      # Botón de ejecución manual en GitHub

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests psycopg[binary]

      - name: Run collector script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python indicators_collector.py
