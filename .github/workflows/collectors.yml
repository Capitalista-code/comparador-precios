name: Actualizar Panel Financiero y Agro

on:
  schedule:
    - cron: '0 12,18 * * *' # Se ejecuta automáticamente 2 veces al día
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  run-collectors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir requests psycopg

      - name: Ejecutar Recolector de Dólares
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collectors/collector_dolar.py

      - name: Ejecutar Recolector de Combustibles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collectors/collector_combustibles.py

      - name: Ejecutar Recolector de Granos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collectors/collector_granos.py
